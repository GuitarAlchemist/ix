[package]
name = "ix-gaia-advisory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools"]
keywords = ["advisory", "provenance", "units", "hexavalent", "deterministic"]
description = "Read-only M3 advisory artifact over copied immutable Gaia evidence. Emits one typed deterministic artifact carrying per-field units, explicit null semantics, content-addressed provenance, and a typed out-of-sample UNKNOWN; and one Class-Development characterization report of count vectors. No authority, no score, no verdict, no threshold, no model fitting."

