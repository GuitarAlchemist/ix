[package]
name = "ix-ixql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
categories = ["development-tools", "parser-implementations"]
keywords = ["ixql", "pipeline", "governance", "interpreter", "baml"]
description = "Parser and evaluator for IXQL, the declarative pipeline language Demerzel writes its governance cycles in. Values flow as serde_json::Value, LLM steps cross the ix-baml seam, and every at-rest write is gated by a JSON Schema."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
ix-baml = { workspace = true }
# `Verdict` uses the canonical hexavalent type rather than a fifth copy of it.
# Already in this crate's graph through ix-pipeline.
ix-types = { workspace = true }
# `compile`: IXQL programs become an ix-pipeline stage DAG, so cycle rejection,
# topological_sort and parallel_levels come from `ix_pipeline::dag::Dag` rather
# than a second scheduler. The edge points language -> runtime and not the other
# way round on purpose: ix-pipeline has eight dependents and must not inherit
# ix-baml + jsonschema through this.
ix-pipeline = { workspace = true }
# Same version/features as ix-quality-validate, the workspace's existing
# JSON-Schema consumer — one validator implementation across the repo.
jsonschema = { version = "0.30", default-features = false }

[[bin]]
# Regenerates the compiled-plan CSV the DuckDB macros read.
name = "ixql-plan"
path = "src/bin/ixql-plan.rs"

[dev-dependencies]
# Integration tests link only against the crate under test plus dev-deps, so the
# seam and the JSON helpers have to be named again here.
ix-baml = { workspace = true }
serde_json = { workspace = true }
# `compile_tests` round-trips the rendered spec through the canonical IR.
ix-pipeline = { workspace = true }
# `verdict_gate_tests` builds verdicts from the canonical hexavalent type.
ix-types = { workspace = true }

[lib]
path = "src/lib.rs"
