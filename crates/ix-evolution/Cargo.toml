[package]
name = "ix-evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["algorithms", "mathematics", "science"]
keywords = ["machine-learning", "math", "algorithms"]
description = "Evolutionary algorithms: genetic algorithms, differential evolution, GP"

[dependencies]
ix-math = { workspace = true }
# `fractal`: the Takagi and de Rham curves. ix-fractal ships the curves,
# ix-evolution owns the operators; this dependency is the join gap-matrix
# C5/C6 called out as missing (refs #204).
ix-fractal = { workspace = true }
ix-optimize = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
thiserror = { workspace = true }
