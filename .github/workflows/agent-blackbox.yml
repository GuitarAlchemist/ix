name: Agent Blackbox

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

# Pinning: AGENT_BLACKBOX_REF is a 40-char commit SHA (not main), per install-audit
# scoring. Bump the SHA in a dedicated PR when consuming a new agent-blackbox release.
# Latest agent-blackbox main commit as of 2026-06-14 (case-insensitive harness-audit paths, #36).
env:
  AGENT_BLACKBOX_REF: "90ed651c73a296c13c9b4953754a2f4898ac4114"
  VERIFY_COMMAND: "pwsh scripts/verify.ps1"
  IX_BLAST_RADIUS_BUILD_COMMAND: ""
  IX_BLAST_RADIUS_COMMAND: ""
  HARNESS_AUDIT_FAIL_BELOW: "60"
  RESPONSE_QUALITY_INPUT: "dist/agent-response.txt"
  RESPONSE_QUALITY_MAX_WORDS: "180"
  RESPONSE_QUALITY_REQUIRE_GROUNDING: "false"

jobs:
  risk-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Governance tests (e.g. ix-agent showcase_r1_migrations) need the
          # governance/demerzel submodule; without this, `verify.ps1`'s
          # `cargo test --workspace` fails here while passing in ci.yml (which
          # already sets submodules) and locally — a false risk-report verdict.
          submodules: recursive

      # The label attests a review of the PR's changes to the policy's blocked and one-way paths. A push that
      # changes them, or that cannot be compared with the head before it, takes it off until the next review.
      # It runs first, so no failing step skips it, and once per push: a re-run replays an old push and would
      # take off a label applied since. It catches a label outliving a push, not a hostile PR, which can edit
      # this step away (that would need pull_request_target). A DELETE that fails fails the job: the label may
      # still be on.
      - name: Withdraw the review label on a push that changes protected paths
        if: github.event.action == 'synchronize' && github.run_attempt == 1
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/review_label_guard.py --base "$BASE_SHA" --before "$BEFORE_SHA" --after "$AFTER_SHA"
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            exit 0
          fi
          label=agent-blackbox-reviewed
          labeled="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq "any(.[]; .name == \"$label\")" 2>/dev/null || echo unknown)"
          if [ "$labeled" = false ]; then
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${label}" > /dev/null
          echo "::notice title=Agent Blackbox::this push changes the protected paths that were reviewed; $label is off until the next review"

      - name: Checkout Agent Blackbox
        uses: actions/checkout@v4
        with:
          repository: GuitarAlchemist/agent-blackbox
          ref: ${{ env.AGENT_BLACKBOX_REF }}
          path: .agent-blackbox
          token: ${{ secrets.AGENT_BLACKBOX_TOKEN || github.token }}

      - name: Collect PR evidence
        shell: bash
        run: |
          mkdir -p dist
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > dist/changed-files.txt
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > dist/diff.patch
          if [ -n "${IX_BLAST_RADIUS_BUILD_COMMAND:-}" ]; then
            bash -lc "$IX_BLAST_RADIUS_BUILD_COMMAND"
          fi
          set +e
          bash -lc "$VERIFY_COMMAND" > dist/test-output.txt 2>&1
          verify_exit=$?
          set -e
          echo "verify_exit=$verify_exit" >> "$GITHUB_ENV"
          export AGENT_BLACKBOX_VERIFY_EXIT="$verify_exit"
          echo "verify command exited with code $verify_exit" >> dist/test-output.txt
          cat dist/test-output.txt
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def event(**kwargs):
              payload = {
                  "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                  **kwargs,
              }
              return json.dumps(payload, sort_keys=True)

          changed_files = [
              line.strip()
              for line in Path("dist/changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          verify_exit = int(os.environ.get("AGENT_BLACKBOX_VERIFY_EXIT", "0"))
          lines = [
              event(
                  event="workflow_evidence",
                  tool="git.diff",
                  status="ok",
                  path="dist/changed-files.txt",
                  data={"changed_file_count": len(changed_files)},
              ),
              event(
                  event="verification",
                  tool="shell.exec",
                  command=os.environ.get("VERIFY_COMMAND", ""),
                  status="ok" if verify_exit == 0 else "failed",
              ),
          ]
          if os.environ.get("IX_BLAST_RADIUS_COMMAND"):
              lines.append(
                  event(
                      event="analysis",
                      tool="ix-blast-radius",
                      command=os.environ["IX_BLAST_RADIUS_COMMAND"],
                      status="ok",
                  )
              )
          Path("dist/agent-trace.jsonl").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate risk report
        shell: bash
        run: |
          analyze_args=(analyze \
            --policy agent-blackbox.policy.json \
            --changed-files dist/changed-files.txt \
            --diff dist/diff.patch \
            --test-output dist/test-output.txt \
            --trace dist/agent-trace.jsonl \
            --out-dir dist)
          if [ -n "${IX_BLAST_RADIUS_COMMAND:-}" ]; then
            analyze_args+=(--ix-blast-radius-cmd "$IX_BLAST_RADIUS_COMMAND")
          fi
          PYTHONPATH=.agent-blackbox python -m cli.agent_blackbox "${analyze_args[@]}"
          # risk-report.json is produced under dist/ by analyze; subsequent steps consume it.

      - name: Generate harness audit
        shell: bash
        run: |
          PYTHONPATH=.agent-blackbox python -m cli.agent_blackbox harness-audit \
            --repo . \
            --out-dir dist \
            --fail-below "${HARNESS_AUDIT_FAIL_BELOW}"

      - name: Generate response quality report
        shell: bash
        run: |
          # response-quality skipped when no agent response is captured for this PR.
          if [ ! -s "${RESPONSE_QUALITY_INPUT}" ]; then
            echo "No response-quality input at ${RESPONSE_QUALITY_INPUT}; skipping."
            exit 0
          fi
          args=(response-quality \
            --input "${RESPONSE_QUALITY_INPUT}" \
            --out-dir dist \
            --max-words "${RESPONSE_QUALITY_MAX_WORDS}")
          if [ "${RESPONSE_QUALITY_REQUIRE_GROUNDING}" = "true" ]; then
            args+=(--require-grounding)
          fi
          PYTHONPATH=.agent-blackbox python -m cli.agent_blackbox "${args[@]}"

      # enforce reads risk-report.json, the PR comment shows risk-report.md. On #313 they
      # described different changesets (ix#316). This fails closed unless both describe this
      # PR's files and evidence, before either is shown or enforced; it runs whatever the
      # labels say, since the label attests a review of the report and a report of another
      # changeset was not reviewed.
      - name: Bind the report to this changeset
        shell: bash
        run: python scripts/risk_report_binding.py --dist dist

      - name: Comment risk report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agent-blackbox-risk-report -->';
            let body = marker + '\n' + fs.readFileSync('dist/risk-report.md', 'utf8');
            if (fs.existsSync('dist/harness-audit.md')) {
              body += '\n\n---\n\n' + fs.readFileSync('dist/harness-audit.md', 'utf8');
            }
            if (fs.existsSync('dist/response-quality.md')) {
              body += '\n\n---\n\n' + fs.readFileSync('dist/response-quality.md', 'utf8');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload risk artifacts
        # The evidence of an unbound report stays downloadable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-blackbox-risk-report
          path: dist/

      # `enforce` is enforce() in cli/agent_blackbox.py at AGENT_BLACKBOX_REF: it prints "Agent Blackbox verdict:
      # <verdict>" and exits 1 on fail, 0 on warn or pass, and 2 with "Agent Blackbox verdict is invalid or
      # missing" otherwise. A crash exits 1 with a traceback and no verdict line.
      - name: Enforce verdict
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The labels and the draft flag are the PR's as it is now, never the event's: a re-run replays its run's
          # event, so an old run re-run after a change would see the PR as it was. GitHub not answering reads as
          # unlabeled and ready.
          pr="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          reviewed="$(gh api "$pr" --jq 'any(.labels[]; .name == "agent-blackbox-reviewed")' 2>/dev/null || echo false)"
          if [ "$reviewed" = "true" ]; then
            echo "Agent Blackbox human-review override label present; skipping hard enforcement."
            exit 0
          fi
          set +e
          said="$(PYTHONPATH=.agent-blackbox python -m cli.agent_blackbox enforce --report dist/risk-report.json)"
          code=$?
          set -e
          echo "$said"
          if [ "$code" = 0 ]; then
            exit 0
          fi
          # A draft is work in progress: a failing verdict, and nothing else (a crash, no verdict), is a warning
          # there. Marking the PR ready runs this job again (ready_for_review), and the verdict then fails it until
          # the label is applied.
          draft="$(gh api "$pr" --jq .draft 2>/dev/null || echo false)"
          if [ "$code" = 1 ] && [ "$said" = "Agent Blackbox verdict: fail" ] && [ "$draft" = "true" ]; then
            echo "::warning title=Agent Blackbox::draft PR: the verdict fails and will be enforced once the PR is ready for review"
            exit 0
          fi
          exit 1
