name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: a shallow checkout has no merge base with main, so
          # `git diff origin/main...HEAD` fails ("no merge base", #396).
          fetch-depth: 0

      # Rust as ci.yml prepares it, so a task can build, test and lint what it wrote.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # cargo and go were refused, so a task pushed tests it could not run (#396).
          # Build, test and lint subcommands only: no `cargo run`, `cargo install` or `go run`.
          # git fetch and git merge too: a task asked to bring main into its branch was refused
          # both, twice (#476, #390, 2026-11-11), and left the branch red on a defect main had fixed.
          # The `go -C <module>` forms, one per module under go/, and `go version` too: a
          # task wrote `go -C go/ixctl vet ./...`, which `Bash(go vet:*)` does not match, and ran
          # nothing (#531, 2026-11-14). `node --test` and `node --check` for the JavaScript tests
          # that sit beside Go code; no `npm`, so no install script runs here. A new module under go/
          # needs its three entries added. No wildcard before the subcommand: it would let `go run` in.
          claude_args: |
            --allowedTools "Bash(cargo build:*),Bash(cargo check:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(go build:*),Bash(go vet:*),Bash(go test:*),Bash(go -C go/claudehooks vet:*),Bash(go -C go/claudehooks test:*),Bash(go -C go/claudehooks build:*),Bash(go -C go/ghbridge vet:*),Bash(go -C go/ghbridge test:*),Bash(go -C go/ghbridge build:*),Bash(go -C go/ixctl vet:*),Bash(go -C go/ixctl test:*),Bash(go -C go/ixctl build:*),Bash(go -C go/ixmux vet:*),Bash(go -C go/ixmux test:*),Bash(go -C go/ixmux build:*),Bash(go -C go/prmap vet:*),Bash(go -C go/prmap test:*),Bash(go -C go/prmap build:*),Bash(go version),Bash(gofmt:*),Bash(node --test:*),Bash(node --check:*),Bash(git fetch:*),Bash(git merge:*)"

