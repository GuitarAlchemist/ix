### Release — build the loadable DuckDB extension and attach it to the tag.
#
# Why this workflow exists: every previous IX tag shipped zero artifacts, so
# nothing this repository produced was ever consumable without cloning it and
# building 60+ crates. `ix-duck-ext` is the one artifact a user genuinely cannot
# build easily — it is deliberately EXCLUDED from the workspace (root
# Cargo.toml) because it drags duckdb + arrow into every `cargo build
# --workspace`, and it needs Python for the metadata footer plus a duckdb CLI to
# resolve the platform string.
#
# Windows only, deliberately. crates/ix-duck-ext/build.ps1 discovers the cdylib
# with a `*.dll` glob, so it produces a Windows artifact and nothing else today.
# Adding linux/macos means generalising that script to .so/.dylib and proving it
# on those runners — real work, not another matrix entry. A release carrying one
# artifact that is known to load beats three where two were never executed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  duckdb-extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ix-duck-ext

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.ps1 reads the DuckDB platform string from the CLI itself
      # (`PRAGMA platform;`) so the footer always matches the engine that will
      # load it. Hardcoding the string here would let the two drift apart, and a
      # footer that disagrees with the engine fails at LOAD, not at build.
      - name: Install DuckDB CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-windows-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile duckdb.zip
          Expand-Archive duckdb.zip -DestinationPath "$env:RUNNER_TEMP\duckdb"
          "$env:RUNNER_TEMP\duckdb" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:RUNNER_TEMP\duckdb\duckdb.exe" -noheader -list -c 'PRAGMA platform;'

      # -SmokeTest is the point of running this in CI at all: it LOADs the
      # emitted extension into a real duckdb.exe and asserts the scalar and
      # table UDFs return known values. Without it we would publish a binary
      # whose only evidence of working is that the compiler accepted it.
      - name: Build and smoke-test the extension
        shell: pwsh
        run: pwsh crates/ix-duck-ext/build.ps1 -SmokeTest

      # v0.3.0 shipped an asset nobody could load, and this step is why.
      #
      # DuckDB derives the init symbol it looks for FROM THE FILE NAME. An
      # extension file called `ix-windows_amd64.duckdb_extension` makes the
      # engine search for `ix-windows_amd64_init_c_api`, which the binary does
      # not export — it exports `ix_init_c_api`, because build.ps1 built it
      # under the name `ix`. Renaming the file to carry the platform therefore
      # broke it, and the error is emitted by LOAD, not by the build:
      #
      #   IO Error: File "ix-windows_amd64.duckdb_extension" did not contain
      #   function "ix-windows_amd64_init_c_api"
      #
      # So the extension keeps its own name and the platform goes on the ZIP,
      # which is also what lets a future multi-platform release attach several
      # assets without a name collision.
      - name: Package the artifact for its platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = (& duckdb -noheader -list -c 'PRAGMA platform;').Trim()
          $src = 'crates/ix-duck-ext/ix.duckdb_extension'
          if (-not (Test-Path $src)) { throw "build.ps1 emitted no artifact at $src" }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item $src pkg/ix.duckdb_extension -Force
          Compress-Archive -Path pkg/ix.duckdb_extension -DestinationPath "ix-$platform.zip" -Force
          Get-Item "ix-$platform.zip" | Select-Object Name, Length

      # The deeper defect behind v0.3.0: build.ps1 -SmokeTest proves the
      # INTERMEDIATE artifact loads, then packaging happens afterwards and is
      # never exercised. A green run therefore said nothing about the bytes
      # users download. This step closes that gap by unpacking the published
      # ZIP into a clean directory and loading THAT copy — the same path a user
      # takes. Any future packaging change that breaks loading fails here
      # instead of on someone else's machine.
      - name: Verify the packaged artifact loads, not the intermediate one
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = (& duckdb -noheader -list -c 'PRAGMA platform;').Trim()
          Expand-Archive "ix-$platform.zip" -DestinationPath verify -Force
          $loadPath = (Resolve-Path verify/ix.duckdb_extension).Path -replace '\\', '/'
          $sql = "LOAD '$loadPath';
            SELECT ix_cosine([1.0,2.0,3.0]::DOUBLE[],[1.0,2.0,3.0]::DOUBLE[]) AS a,
                   ix_euclidean([0.0,0.0]::DOUBLE[],[3.0,4.0]::DOUBLE[])      AS b,
                   (SELECT count(*) FROM duckdb_functions()
                      WHERE function_name LIKE 'ix\_%' ESCAPE '\')            AS n;"
          $row = (& duckdb -unsigned -noheader -list -c $sql).Trim()
          Write-Host " - packaged artifact: $row"
          $parts = $row -split '\|'
          if ($parts[0] -notmatch '^1(\.0)?$' -or $parts[1] -notmatch '^5(\.0)?$') {
            throw "PACKAGED ARTIFACT FAILED — expected '1.0|5.0|N', got '$row'"
          }
          # The function count is asserted as a floor, not an exact number: new
          # UDFs must not have to touch this workflow, but an extension that
          # loads while registering nothing must not pass.
          if ([int]$parts[2] -lt 50) {
            throw "PACKAGED ARTIFACT REGISTERED ONLY $($parts[2]) ix_* functions"
          }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ix-*.zip
          fail_on_unmatched_files: true
          body: |
            Loadable DuckDB extension exposing IX algorithms as SQL UDFs:
            graph (PageRank, shortest path, components), clustering (k-means,
            DBSCAN, GMM), projections (PCA, t-SNE, MDS), vector distances,
            ranking metrics (nDCG, MRR, precision@k), probabilistic sketches
            (HyperLogLog, Bloom, Cuckoo, Count-Min), statistics, signal
            processing (rFFT, DCT, wavelet, Kalman, Viterbi), code analysis,
            and pitch-class set theory.

            Download the ZIP for your platform and extract it. **Keep the file
            named `ix.duckdb_extension`** — DuckDB derives the init symbol it
            looks for from the file name, so a renamed extension will not load.

            ```sql
            LOAD 'ix.duckdb_extension';
            SELECT ix_cosine([1.0,2.0,3.0]::DOUBLE[], [1.0,2.0,3.0]::DOUBLE[]);
            SELECT * FROM ix_pagerank('[[0,1],[1,2],[2,0]]', 0.85, 20);
            ```

            The extension only loads into an engine whose `PRAGMA platform;`
            matches the one in the ZIP name. CI built it, loaded it, and
            asserted the UDFs on the packaged copy that this release attaches.

            Note: the source archives GitHub generates for a tag do NOT include
            the `governance/demerzel` submodule. Clone with
            `--recurse-submodules` rather than downloading the tarball.
