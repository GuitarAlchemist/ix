name: Karpathy/Cherny Discipline Check

on:
  pull_request:
    paths:
      - 'docs/contracts/digest-schema.json'
      - 'state/digests/**'
      - '.claude/settings.json'
      - '.claude/skills/digest/**'
      - '.claude/skills/correct/**'
      - '.claude/skills/learnings/**'
      - '.claude/hooks/**'
      - 'go/claudehooks/**'
      - 'CLAUDE.md'
      - '.github/workflows/karpathy-cherny-discipline.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validators
        run: pip install jsonschema pyyaml

      - name: Verify digest schema is well-formed JSON
        run: python -c "import json; json.load(open('docs/contracts/digest-schema.json'))"

      - name: Verify CLAUDE.md contains Karpathy 4 Rules section
        run: |
          if ! grep -q "Karpathy 4 Rules" CLAUDE.md; then
            echo "::error file=CLAUDE.md::CLAUDE.md must contain a 'Karpathy 4 Rules' section."
            exit 1
          fi

      # The hooks are one Go program, go/claudehooks (ix-hooks <hook>): no shell in hooks (the
      # user's rule, 2026-11-05). Its tests carry the former bash fixtures (correction detector
      # FR/EN, governance blocks, session-start injection) and the digest hooks' contracts.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/claudehooks/go.mod
          cache: false

      - name: Vet and test the hooks (go/claudehooks)
        working-directory: go/claudehooks
        run: |
          go vet ./...
          go test -count=1 ./...

      # "No hook runs a shell or a script" has one implementation, `ix doctor`'s hooks check
      # (crates/ix-cli/src/doctor/hooks.rs, runs_shell). ci.yml runs it on every change to
      # .claude/settings.json, .claude/hooks/** or go/claudehooks: `ix doctor` and the doctor_hooks
      # test in `cargo test --workspace`. A grep copy here missed 'quoted' programs and env.
      - name: Verify every digest hook is wired to ix-hooks
        shell: bash
        run: |
          fail=0
          for h in precompact-digest digest-staleness-nudge digest-activity-tracker digest-stop-finalize correction-detector; do
            if ! grep -q "ix-hooks\\\\\" $h\"" .claude/settings.json; then
              echo "::error file=.claude/settings.json::hook $h is not wired to ix-hooks"
              fail=1
            fi
          done
          if ! grep -q 'run ./cmd/ix-hooks session-start' .claude/settings.json; then
            echo "::error file=.claude/settings.json::session-start (digest injection, binary install) is not wired"
            fail=1
          fi
          exit $fail

      - name: Verify .claude/settings.json is valid JSON
        run: python -c "import json; json.load(open('.claude/settings.json'))"

      - name: Verify required skills exist
        shell: bash
        run: |
          missing=0
          for f in ".claude/skills/digest/SKILL.md" ".claude/skills/correct/SKILL.md" ".claude/skills/learnings/SKILL.md"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required skill missing: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Validate any committed digest archives against schema
        run: |
          python <<'PYEOF'
          import json, glob, re, sys, os
          import yaml
          from jsonschema import validate, ValidationError

          if not os.path.exists('docs/contracts/digest-schema.json'):
              sys.exit(0)
          with open('docs/contracts/digest-schema.json') as f:
              schema = json.load(f)
          errors = []
          for path in glob.glob('state/digests/archive/*.md'):
              with open(path) as f:
                  content = f.read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not m: continue
              try:
                  fm = yaml.safe_load(m.group(1))
                  validate(instance=fm, schema=schema)
              except (ValidationError, yaml.YAMLError) as e:
                  errors.append(f"{path}: {e}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All committed digests valid (or none committed).')
          PYEOF
