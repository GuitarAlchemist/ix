### ixctl release — build the control plane for Windows and Linux (amd64) from a tag,
### prove each binary describes itself, and publish the binaries with their digests
### and the probe kinds they carry.
#
# Same two-job shape as release.yml: `build` runs per platform and never publishes;
# `publish` runs once, after both, and assembles one DRAFT release: nothing is public
# until someone publishes it by hand, and it never becomes the repository's Latest. The
# tag is `ixctl/v<semver>`; the binary's `version` is set from it with -ldflags, so
# `ixctl version`, `/health` and `probe.kinds` all report the tag.
#
# Only `publish` holds a write token; `build` runs the tagged code's tests with a read
# one. The tag reaches scripts through `env:`, never pasted into their source. A `pwsh`
# step fails only on its last native command's exit code, so each `go` command is
# checked where it runs. Pinned by crates/ix-harness-github-actions/tests/release_workflows.rs.
#
# Provenance (decision D8, ix#406): each asset ships with its SHA-256 and a
# `probes.json` written by the binary itself (`ixctl probes`), so a consumer can
# tell which probe kinds and limits a given release carries without running it.
name: ixctl release

on:
  push:
    tags: ['ixctl/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing ixctl/v* tag to build and attach to
        required: true

permissions:
  contents: read

# A tag push and a dispatch of the same tag never race on one release.
concurrency:
  group: ixctl-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows_amd64
            exe: .exe
          - os: ubuntu-latest
            platform: linux_amd64
            exe: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # A dispatch names a tag: refs/tags/ keeps a branch of the same name out. A tag push
      # builds the commit that triggered it, on both platforms, even if the tag moves.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/ixctl/go.mod
          cache-dependency-path: go/ixctl/go.sum

      - name: Build with the tag as the version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          if ($tag -notmatch '^ixctl/v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "tag '$tag' is not ixctl/v<semver>" }
          $version = $tag -replace '^ixctl/v', ''
          $env:CGO_ENABLED = '0'
          Push-Location go/ixctl
          go vet .
          if ($LASTEXITCODE) { throw 'go vet failed' }
          go test -count=1 .
          if ($LASTEXITCODE) { throw 'go test failed' }
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "ixctl-${{ matrix.platform }}${{ matrix.exe }}" .
          if ($LASTEXITCODE) { throw 'go build failed' }
          Pop-Location
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The binary that will be attached describes itself: its version is the tag's, and
      # `ixctl probes` prints the kinds and limits it carries. That output is the manifest.
      - name: Verify the binary and write its manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "go/ixctl/ixctl-${{ matrix.platform }}${{ matrix.exe }}"
          $v = (& $bin version).Trim()
          if ($v -ne "ixctl $env:VERSION") { throw "binary reports '$v', expected 'ixctl $env:VERSION'" }
          & $bin probes | Out-File "probes-${{ matrix.platform }}.json" -Encoding utf8
          $m = Get-Content "probes-${{ matrix.platform }}.json" -Raw | ConvertFrom-Json
          if ($m.version -ne $env:VERSION -or $m.kinds.Count -lt 4 -or -not $m.limits.max_nodes) {
            throw "manifest does not describe the binary: $(Get-Content "probes-${{ matrix.platform }}.json" -Raw)"
          }
          $hash = (Get-FileHash $bin -Algorithm SHA256).Hash.ToLower()
          "$hash  ixctl-${{ matrix.platform }}${{ matrix.exe }}" | Out-File "ixctl-${{ matrix.platform }}.sha256" -Encoding ascii
          Copy-Item $bin .
          $kinds = ($m.kinds | ForEach-Object { $_.kind }) -join ', '
          @(
            "### ${{ matrix.platform }} — ${{ matrix.os }}",
            "",
            "- [x] go vet, go test, built with ``-X main.version=$env:VERSION``",
            "- [x] ``ixctl version`` reports the tag",
            "- [x] probe kinds: $kinds",
            "- [x] limits: max_nodes $($m.limits.max_nodes), max_depth $($m.limits.max_depth), min_every_ms $($m.limits.min_every_ms), ring $($m.limits.ring)",
            "- SHA-256 ``$hash``",
            ""
          ) -join "`n" | Out-File "report-${{ matrix.platform }}.md" -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ixctl-${{ matrix.platform }}
          path: |
            ixctl-${{ matrix.platform }}${{ matrix.exe }}
            ixctl-${{ matrix.platform }}.sha256
            probes-${{ matrix.platform }}.json
            report-${{ matrix.platform }}.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble the release body from what each platform reported
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          $repo = "${{ github.repository }}"
          $reports = Get-ChildItem dist -Filter 'report-*.md' | Sort-Object Name
          if ($reports.Count -ne 2) { throw "expected 2 platform reports, found $($reports.Count)" }
          $checklist = ($reports | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          @(
            "ixctl, IX's control plane: supervises declared services, reconciles desired state",
            "(plan/apply), bounds each run (wall, memory, processor time, processes), federates with",
            "peers, and runs a tree of in-process probes (``probe.*`` ops). The ``ixctl.v1`` protocol",
            "and the desired-state document ``ixctl-desired/0`` are frozen: see",
            "docs/adr/0014-ixctl-v1-and-desired-state-frozen.md. The journal, the probe surface and",
            "bookmarks are provisional: see docs/plans/2026-10-20-ixctl-probes.md.",
            "",
            "## Assets",
            "",
            "One static binary per platform, its SHA-256 beside it, and ``probes-<platform>.json``:",
            "the probe kinds and limits that binary carries, written by the binary itself.",
            "",
            "## Validated in CI",
            "",
            $checklist,
            "## Links",
            "",
            "- [Source](https://github.com/$repo/tree/$tag/go/ixctl)",
            "- [README](https://github.com/$repo/blob/$tag/go/ixctl/README.md)",
            "- [This build](https://github.com/$repo/actions/runs/${{ github.run_id }})"
          ) -join "`n" | Out-File body.md -Encoding utf8

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/ixctl-*
            dist/probes-*.json
          fail_on_unmatched_files: true
          body_path: body.md
          draft: true
          make_latest: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
