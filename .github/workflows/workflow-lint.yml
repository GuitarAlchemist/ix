### Workflow lint: actionlint and zizmor over every workflow, and a finding fails the job.
#
# The only workflow lint ix had ran "if actionlint is available", and no runner had it, so it
# was green and checked nothing (retro of 2026-10-22). Each tool here is a pinned release whose
# bytes are verified before it runs.
#
# actionlint runs without its shellcheck and pyflakes passes: the runner image ships shellcheck
# and a dev machine may not, and the gate must give the same answer in both places. zizmor runs
# offline (the same answer with no GitHub API) and fails on High findings under the policy in
# .github/zizmor.yml, a blocked path of agent-blackbox.policy.json. Pinned by
# crates/ix-harness-github-actions/tests/workflow_lint.rs.
#
# Locally:  actionlint -shellcheck= -pyflakes=
#           zizmor --offline --min-severity high --config .github/zizmor.yml .github/workflows
name: Workflow lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: '1.7.12'
  # actionlint_1.7.12_linux_amd64.tar.gz, as listed in the release's checksums file.
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  ZIZMOR_VERSION: '1.30.1'
  # zizmor-1.30.1-py3-none-manylinux_2_28_x86_64.whl on PyPI; the wheel has no dependencies.
  ZIZMOR_SHA256: 'eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e'

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: zizmor
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary :all: --require-hashes -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --version
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --min-severity high --config .github/zizmor.yml .github/workflows
