name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The nightly leg is pinned to a dated toolchain on purpose. Clippy
        # runs under `-D warnings`, so a floating `nightly` turns any upstream
        # lint change into a red build on unrelated PRs -- as happened on
        # 2026-08-25, when a widened `needless_range_loop` broke every nightly
        # job for twelve days. Bump this date deliberately, in its own PR, so
        # new lints are triaged rather than dumped on whoever pushes next.
        rust: [stable, nightly-2026-08-23]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Showcase smoke tests
        # Runs all 9 advanced pipelines via the ix binary to catch skill
        # registry regressions end-to-end. ~1s total runtime.
        shell: bash
        run: |
          export IX_ROOT="$PWD"
          export IX_GOVERNANCE_DIR="$PWD/governance/demerzel"
          # Locate the ix binary that cargo test just built.
          IX_BIN="$PWD/target/debug/ix.exe"
          [[ -f "$IX_BIN" ]] || IX_BIN="$PWD/target/debug/ix"
          for yaml in examples/showcase/advanced/*.yaml; do
            name="$(basename "$yaml" .yaml)"
            tmp="$(mktemp -d)"
            cp "$yaml" "$tmp/ix.yaml"
            ( cd "$tmp" && "$IX_BIN" pipeline run --json >/dev/null ) \
              || { echo "::error::pipeline $name failed"; exit 1; }
            rm -rf "$tmp"
            echo "ok $name"
          done

      - name: Build docs
        if: matrix.rust == 'stable'
        run: cargo doc --workspace --no-deps

  # Feature-gated code is invisible to the job above. `cargo build --workspace`
  # and `cargo test --workspace` compile the DEFAULT feature set, so a module
  # behind a non-default feature that no workspace member enables is never
  # compiled, never linted and never tested -- while contributing zero failures
  # and looking indistinguishable from covered code in every signal this repo
  # produces.
  #
  # That is not hypothetical. `crates/ix-code/src/topology.rs` -- 296 lines and
  # five tests -- lived on `main` behind the `topology` feature, which nothing
  # enabled. CI had never compiled it once; rust-analyzer reported it as "not
  # included in any crates". Its five tests could not fail, because they were
  # never run. See ix#315.
  #
  # This job is deliberately NOT `--all-features`. That flag would drag in
  # `ix-duck`'s `duck` feature (DuckDB + arrow, which the root Cargo.toml keeps
  # out of the default build on purpose) and `memristive-markov`'s `gpu`, which
  # may need hardware a runner does not have. A blanket flag would make every
  # run slower and let it fail for environmental reasons unrelated to any
  # change. The crates listed here pull only other IX crates and self-contained
  # C grammars, so they are cheap and hermetic.
  #
  # This list is a stopgap. `ix doctor`'s uncompiled-source check (ix#318)
  # DERIVES the same answer from cargo metadata and reports magnitude with it, so
  # it finds a dark feature nobody remembered to add here. Prefer fixing what that
  # check reports over extending this matrix.
  #
  # Two entries deliberately absent, because compiling them in CI is not free and
  # is its own decision: `ix-duck/duck` pulls DuckDB and arrow, which the root
  # Cargo.toml keeps out of the default build on purpose, and
  # `memristive-markov/gpu` may need hardware a runner does not have. Between them
  # they are the largest dark surface in the repository — ix-duck alone carries
  # ~10k lines and 174 tests behind `udf` and `duck`.
  gated-features:
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: ix-code
            features: full          # semantic, trajectory, topology, gates, advanced, physics
          - crate: ix-autograd
            features: fft-autograd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: gated-${{ matrix.crate }}

      - name: Clippy ${{ matrix.crate }} --features ${{ matrix.features }}
        run: cargo clippy -p ${{ matrix.crate }} --features ${{ matrix.features }} --all-targets -- -D warnings

      # The point of the job: these tests exist and have never been executed.
      - name: Test ${{ matrix.crate }} --features ${{ matrix.features }}
        run: cargo test -p ${{ matrix.crate }} --features ${{ matrix.features }}
