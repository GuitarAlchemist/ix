name: ix-duck chatbot gate

# Hard, hermetic gate for the chatbot flight recorder (ix-duck `duck` feature).
# Runs ONLY over vendored fixtures (crates/ix-duck/tests/fixtures) so it is fully
# ix-owned and merge-blocking without depending on the GA sibling. This is also the
# only place CI compiles the `duck` feature (bundled DuckDB), so it de-risks all
# ix-duck code — the default `cargo build --workspace` never pulls duckdb.
#
# Path-filtered (the bundled C++ build is heavy) + rust-cache with a shared key so
# the rarely-triggered job isn't perpetually cold. The live-GA corpus is checked by
# the separate, non-blocking chatbot-trace-regression-nightly workflow.

on:
  push:
    branches: [main]
    paths:
      - 'crates/ix-duck/**'
      - 'crates/ix-code/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ix-harness-github-actions/tests/ix_duck_workflow_paths.rs'
      - '.github/workflows/ix-duck-chatbot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/ix-duck/**'
      - 'crates/ix-code/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/ix-harness-github-actions/tests/ix_duck_workflow_paths.rs'
      - '.github/workflows/ix-duck-chatbot.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  chatbot-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint chatbot workflow if actionlint is available
        shell: bash
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            actionlint .github/workflows/ix-duck-chatbot.yml
          else
            echo "actionlint is not installed on this runner."
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ix-duck-duck
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Regression for chatbot workflow path filters
        run: cargo test -p ix-harness-github-actions --test ix_duck_workflow_paths

      - name: Clippy (duck feature)
        run: cargo clippy -p ix-duck --all-targets --features duck -- -D warnings

      - name: Test (duck feature)
        run: cargo test -p ix-duck --features duck

      # `code-semantic` (tree-sitter Tier B: ix_semantic_metrics / ix_ast_query) is
      # otherwise compiled only at release, through ix-duck-ext. Its tests live in
      # `code::tests`, which is `cfg(all(test, feature = "duck"))` because they open
      # a bench connection, so `duck` has to come with it or they silently vanish.
      - name: Clippy (duck + code-semantic features)
        run: cargo clippy -p ix-duck --all-targets --features duck,code-semantic -- -D warnings

      - name: Test (duck + code-semantic features)
        run: cargo test -p ix-duck --features duck,code-semantic

      - name: Hard gate over vendored fixtures (must pass; nonzero on regression)
        run: cargo run -p ix-duck --features duck --example ix_chatbot_lens -- check crates/ix-duck/tests/fixtures/chatbot-qa

  null-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        source:
          - '4c39648ec8cb0c3b565927f5389755933c65b3ae'
          - '9713616691a947932a7283827df5430c54d526f7'
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ix-duck-duck
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Reproduce NULL passthrough on pinned source
        shell: bash
        run: |
          echo "[DEBUG-null346] source=${{ matrix.source }}"
          for attempt in $(seq 1 20); do
            echo "[DEBUG-null346] attempt=$attempt"
            cargo test -p ix-duck --features duck,code-semantic --lib tests::ix_cosine_passes_null_through -- --exact --nocapture
          done

  null-regression:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ix-duck-duck
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Deterministic NULL descriptor regression
        run: cargo test -p ix-duck --features duck,code-semantic --lib udf::tests -- --nocapture
