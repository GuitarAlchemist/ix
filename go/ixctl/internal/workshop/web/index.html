<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151e"><title>IxForge</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><script src="vendor/i18next.min.js" defer></script><script type="module" src="app.js"></script></head>
<body><header><div class="brand"><span class="mark">W</span><div><h1 id="app-name">IxForge</h1><p data-i18n="tagline"></p></div></div><div class="preferences"><label><span data-i18n="language"></span><select id="language"><option value="fr">Français</option><option value="en">English</option></select></label><label><span data-i18n="theme"></span><select id="theme"><option value="system" data-i18n="system"></option><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select></label><button id="install" hidden data-i18n="install"></button></div></header>
<div class="connection"><span id="connection" role="status"></span><button id="sync" data-i18n="sync"></button><button id="update" hidden data-i18n="update"></button></div>
<main><aside><div class="section-title"><h2 data-i18n="projects"></h2><button id="new-project" data-i18n="newProject"></button></div><nav id="projects" aria-label="Projects"></nav><details id="pair-panel" open><summary data-i18n="pairTitle"></summary><p data-i18n="pairHelp"></p><label><span data-i18n="deviceName"></span><input id="device-name" maxlength="120" value="Tablet"></label><label><span data-i18n="pairCode"></span><input id="pair-code" autocomplete="off" maxlength="80"></label><button id="pair" data-i18n="pair"></button><button id="replace-access" hidden data-i18n="replaceAccess"></button><p class="hint" data-i18n="tailscale"></p></details><p class="hint" data-i18n="installHelp"></p></aside>
<section class="content"><section class="composer"><span class="eyebrow" data-i18n="fromVoice"></span><h2 data-i18n="createTitle"></h2><p data-i18n="voiceHelp"></p><label for="transcript" data-i18n="transcript"></label><textarea id="transcript" rows="3" maxlength="1000"></textarea><div class="actions"><button id="dictate" class="secondary" data-i18n="dictate"></button><button id="stop-dictation" hidden data-i18n="stopDictation"></button><button id="interpret" data-i18n="interpret"></button></div><p id="voice-status" class="hint" role="status"></p><p id="intent" class="intent" role="status"></p><button id="apply" hidden data-i18n="apply"></button></section>
<section class="editor"><div class="section-title"><h2 data-i18n="workspace"></h2><span id="save-status" role="status"></span></div><p id="empty" data-i18n="empty"></p><div id="project-editor" hidden><label><span data-i18n="projectTitle"></span><input id="project-title" maxlength="240"></label><div class="actions"><button id="save" data-i18n="save"></button><span id="revision" class="hint"></span></div><div id="conflict" class="conflict" hidden><p data-i18n="conflictHelp"></p><pre id="remote-title"></pre><button id="keep-local" data-i18n="keepLocal"></button><button id="use-desktop" data-i18n="useDesktop"></button></div><div id="workspaces"></div></div></section><p class="runtime" data-i18n="runtime"></p></section></main>
<p class="runtime" id="client-version"></p><p class="runtime" id="update-status" role="status"></p><p class="runtime" data-i18n="updatePolicy"></p><p id="notice" class="notice" role="alert"></p><noscript>JavaScript est nécessaire pour garder les projets sur cet appareil. JavaScript is required for local project storage.</noscript></body></html>
